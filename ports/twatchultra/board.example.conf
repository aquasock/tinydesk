# Board configuration for the LilyGo T-Watch Ultra port (EXAMPLE).
#
# With this file as it is, the desktop is on the watch's AMOLED and its touch
# panel, the keyboard arrives on the ESP32-S3's own USB Serial/JTAG port
# (USB-C) and also mirrors the picture, and nothing else is wired.
#
# Format: one "key = value" per line; '#' starts a comment; an empty value
# ("key =") unsets a key. GPIO and UART numbers are plain numbers, -1 means
# "not connected". Keys that are missing mean "this board does not have it".
#
# How it is used:
#   * Build time: the port builds in board.conf from this folder when it
#     exists (your own wiring; board.conf is in .gitignore), otherwise this
#     example. Copy this file to board.conf and edit it.
#   * Run time: /etc/board.conf on the device (the shell's `board` command
#     creates and edits it) overrides the built-in settings; restart after a
#     change.
#
# Taken by the board (not for other uses): the panel's QSPI bus (SCK 40,
# D0-D3 38/39/42/45, CS 41, RST 37) and its tearing-effect line (6); the
# touch panel's I2C (SDA 3, SCL 2); the PMU's interrupt (7); USB (19, 20);
# the flash and quad PSRAM (26-37 plus the quad data lines).
#
# Written from the Escapement project's reference library (BRD-001..BRD-005),
# which recorded every one of these from the hardware.

# --- The panel (CO5300 AMOLED, QSPI) --------------------------------------
# The watch's panel is a 4-lane QSPI AMOLED, not an SPI TFT: four data lines
# are what make a full 410x502 frame affordable. The visible glass is
# 410x502 with 45-degree chamfers; the largest unclipped rectangle the
# desktop uses is 320x400, which is what LCD_W/LCD_H are set to.
lcd.sck      = 40
lcd.d0       = 38
lcd.d1       = 39
lcd.d2       = 42
lcd.d3       = 45
lcd.cs       = 41
lcd.rst      = 37
lcd.te       = 6
# QSPI clock. The Cotswold/CO5300 is clean at 40 MHz on this board; the
# transfer is not clock bound (measured), so there is nothing to gain above
# it and margin to lose.
lcd.spi_mhz  = 40

# --- The touch panel (CST9217, I2C) ---------------------------------------
# All of this board's peripherals share one bus: PMU 0x34, expander 0x20,
# RTC 0x51, haptic 0x5A, touch 0x1A.
i2c.sda      = 3
i2c.scl      = 2
i2c.hz       = 400000
touch.addr   = 0x1A
touch.int    = 12
# The controller reports 410x502, the panel's own coordinates, so no axis
# swap or scale is needed (measured on the hardware).
touch.width  = 410
touch.height = 502

# --- The desktop's keyboard (USB Serial/JTAG) -----------------------------
# There is no UART bridge on this board. console.uart is -1 because UART0 is
# not wired to anything reachable.
console.uart = -1
# 1 (default): the USB port also shows the desktop, so a host terminal is a
# second view of the same screen. The mirror is best-effort and never blocks
# the panel: it gets a 15 ms budget per frame and is allowed to fall behind,
# because on this board "plugged into a PC" does not mean "something is
# reading" -- usb_serial_jtag_is_connected() only reports the USB host.
lcd.mirror   = 1

# --- Bluetooth keyboard and mouse -----------------------------------------
# The watch's input. 320x400 of glass is too small to type on, so the desktop
# has no on-screen keyboard here: a Bluetooth LE keyboard and mouse drive it,
# and the touch panel is the pointer only for dragging and tapping.
# Pair from the desktop's Bluetooth app; pairings are kept in NVS across
# reboots. NimBLE is a central, so the watch connects to the keyboard rather
# than the other way round.
bt.enable    = 1

# --- SD card (OPT-IN; the hardware is proven) -----------------------------
# The watch has an SD slot on the second SPI bus (ESP-IDF host 2) and the
# AXP2101's ALDO1 feeds it. Both work, verified on the glass: a 29 GB and a
# 128 GB FAT32 card each mounted at /sd, wrote a file that read back
# byte-exact, and appeared in Files as `sd/`. The port already does the two
# things that took finding: board_power_rails_preinit() raises ALDO1, and it
# parks the other chip selects, both before the watcher starts. (The
# Escapement record that called this bus "never proven to transfer a byte"
# was measured on Linux's spi-mem stack and does not carry over here.)
#
# MISO IS SHARED, so the parking is load-bearing rather than tidy: the LoRa
# radio (CS 36) and the NFC reader (CS 4) sit on this bus, and a chip select
# left floating low leaves that part driving MISO and corrupts every SD
# transaction. That presents as a card that will not answer, not as a bus
# fault, which is why it cost two wrong diagnoses on the Linux side.
#
# FAT32 is the requirement, not a size limit. ESP-IDF 5.3 builds FatFs with
# FF_FS_EXFAT hardcoded to 0, so an exFAT card cannot mount at any capacity,
# and cards above 32 GB normally ship exFAT: reformat as FAT32 (mkfs.vfat
# does it; Windows' own format tool refuses above 32 GB).
#
# Left commented because a card is optional, not because the answer is in
# doubt. With these set and no card fitted, the watcher retries the mount
# every 5 s for ever, and each retry is a probe on the shared bus.
#
# sd.automount = 1 also starts the hot-plug watcher, and hot-plug is UNTESTED
# in either direction -- every boot so far had the card already in. sd.cd is
# deliberately absent: it takes an ESP32-S3 GPIO, and this board's insert
# switch is XL9555 expander pin 10 (P1 bit 2, EXPANDS_SD_DET), so wiring it
# needs expander support tdsh_sdcard.c does not have. Do not set sd.cd = 10
# as a shortcut: GPIO10 is the I2S word clock. Until then, removal is noticed
# by the card not answering rather than by the switch.
#
# Store installs to the card, and the image cache at /sd/TinyDesk/cache, have
# not been run against a card at any capacity.
#sd.spi_host = 2
#sd.sclk     = 35
#sd.mosi     = 34
#sd.miso     = 33
#sd.cs       = 21
#sd.automount = 1
